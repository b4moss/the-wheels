<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Nav — The Wheels kitchen-sink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module">
      import "@b4moss/the-wheels-components";
      import menuUrl from "@b4moss/the-wheels-components/assets/menu.svg?url";

      const icon = document.querySelector("#nav-home-icon");
      if (icon) icon.setAttribute("src", menuUrl);
    </script>
  </head>
  <body>
    <div class="ks-shell container">
      <nav class="ks-nav" aria-label="kitchen-sink">
        <a href="/">Home</a>
        <a href="/typography/">Typography</a>
        <a href="/tokens/">Tokens</a>
        <a href="/svg-loader/">SVGLoader</a>
        <a href="/spinner/">Spinner</a>
        <a href="/button/">Button</a>
        <a href="/dropdown/">Dropdown</a>
        <a href="/action-menu/">ActionMenu</a>
        <a href="/accordion/">Accordion</a>
        <a href="/modal/">Modal</a>
        <a href="/avatar/">Avatar</a>
        <a href="/vertical-nav/" aria-current="page">Vertical Nav</a>
      </nav>

      <main>
        <h1>Vertical Nav</h1>
        <p class="ks-meta">Item ラッパー · aria-current · layout-sidebar デモ</p>

        <div class="layout-sidebar">
          <aside class="sidebar">
            <nav aria-label="demo">
              <ul style="list-style: none; margin: 0; padding: 0; max-width: none">
                <li style="max-width: none; margin: 0">
                  <tw-vertical-nav>
                    <a href="#home" aria-current="page">
                      <tw-svg-loader
                        id="nav-home-icon"
                        width="18"
                        height="18"
                      ></tw-svg-loader>
                      Home
                    </a>
                  </tw-vertical-nav>
                </li>
                <li style="max-width: none; margin: 0">
                  <tw-vertical-nav>
                    <a href="#docs">Documents</a>
                  </tw-vertical-nav>
                </li>
                <li style="max-width: none; margin: 0">
                  <tw-vertical-nav>
                    <a href="#settings">Settings</a>
                  </tw-vertical-nav>
                </li>
              </ul>
            </nav>
          </aside>

          <section>
            <h2>メイン</h2>
            <p>
              リストは素の HTML、項目だけが <code>tw-vertical-nav</code> です。
              現在地は slot 内の <code>aria-current="page"</code> で指定します。
            </p>
            <p class="ks-focus-row">
              <tw-avatar name="山田" width="48" height="48"></tw-avatar>
              <span>ナビとアバターの併記例</span>
            </p>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
