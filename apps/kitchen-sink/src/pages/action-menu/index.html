<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActionMenu — The Wheels kitchen-sink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module">
      import "@b4moss/the-wheels-components";
      import checkUrl from "@b4moss/the-wheels-components/assets/check.svg?url";

      const swap = document.getElementById("src-swap");
      if (swap) swap.setAttribute("src", checkUrl);
    </script>
  </head>
  <body>
    <div class="ks-shell">
      <nav class="ks-nav" aria-label="kitchen-sink">
        <a href="/">Home</a>
        <a href="/typography/">Typography</a>
        <a href="/tokens/">Tokens</a>
        <a href="/svg-loader/">SVGLoader</a>
        <a href="/spinner/">Spinner</a>
        <a href="/button/">Button</a>
        <a href="/dropdown/">Dropdown</a>
        <a href="/action-menu/" aria-current="page">ActionMenu</a>
        <a href="/accordion/">Accordion</a>
        <a href="/modal/">Modal</a>
        <a href="/avatar/">Avatar</a>
        <a href="/vertical-nav/">Vertical Nav</a>
      </nav>

      <main>
        <h1>ActionMenu</h1>
        <p class="ks-meta">デフォルト more-vertical · src 差し替え · カスタム trigger</p>

        <section>
          <h2>デフォルト</h2>
          <p class="ks-row">
            <tw-action-menu>
              <button type="button">編集</button>
              <button type="button">複製</button>
              <button type="button">削除</button>
            </tw-action-menu>
          </p>
        </section>

        <section>
          <h2>src 差し替え</h2>
          <p class="ks-row">
            <tw-action-menu id="src-swap">
              <button type="button">完了にする</button>
              <button type="button">キャンセル</button>
            </tw-action-menu>
          </p>
        </section>

        <section>
          <h2>カスタム trigger</h2>
          <p class="ks-row">
            <tw-action-menu>
              <tw-button slot="trigger" variant="stroke">操作</tw-button>
              <button type="button">共有</button>
              <button type="button">エクスポート</button>
            </tw-action-menu>
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
