<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spinner — The Wheels kitchen-sink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module">
      import "@b4moss/the-wheels";
    </script>
  </head>
  <body>
    <div class="ks-shell">
      <nav class="ks-nav" aria-label="kitchen-sink">
        <a href="/">Home</a>
        <a href="/typography/">Typography</a>
        <a href="/tokens/">Tokens</a>
        <a href="/svg-loader/">SVGLoader</a>
        <a href="/spinner/" aria-current="page">Spinner</a>
        <a href="/button/">Button</a>
        <a href="/dropdown/">Dropdown</a>
        <a href="/action-menu/">ActionMenu</a>
        <a href="/accordion/">Accordion</a>
        <a href="/modal/">Modal</a>
        <a href="/avatar/">Avatar</a>
        <a href="/vertical-nav/">Vertical Nav</a>
      </nav>

      <main>
        <h1>Spinner</h1>
        <p class="ks-meta">同梱 spinner.svg（SVG アニメーション）/ デフォルト 1em</p>

        <section>
          <h2>デフォルト（1em）</h2>
          <p style="font-size: 2.4rem">
            読み込み中 <tw-spinner stroke-color="var(--tw-text-main)"></tw-spinner>
          </p>
        </section>

        <section>
          <h2>サイズ指定</h2>
          <p class="ks-row">
            <tw-spinner width="16" height="16" stroke-color="var(--tw-text-main)"></tw-spinner>
            <tw-spinner width="32" height="32" stroke-color="var(--tw-text-main)"></tw-spinner>
            <tw-spinner width="48" height="48" stroke-color="var(--tw-alert)"></tw-spinner>
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
