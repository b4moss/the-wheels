<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar — The Wheels kitchen-sink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module">
      import "@b4moss/the-wheels-components";
    </script>
  </head>
  <body>
    <div class="ks-shell">
      <nav class="ks-nav" aria-label="kitchen-sink">
        <a href="/">Home</a>
        <a href="/typography/">Typography</a>
        <a href="/tokens/">Tokens</a>
        <a href="/svg-loader/">SVGLoader</a>
        <a href="/spinner/">Spinner</a>
        <a href="/button/">Button</a>
        <a href="/dropdown/">Dropdown</a>
        <a href="/action-menu/">ActionMenu</a>
        <a href="/accordion/">Accordion</a>
        <a href="/modal/">Modal</a>
        <a href="/avatar/" aria-current="page">Avatar</a>
        <a href="/vertical-nav/">Vertical Nav</a>
      </nav>

      <main>
        <h1>Avatar</h1>
        <p class="ks-meta">書記素イニシャル · コントラスト · 画像モード</p>

        <section>
          <h2>イニシャル</h2>
          <p class="ks-focus-row">
            <tw-avatar name="山田太郎"></tw-avatar>
            <tw-avatar name="Alice" color="#3b3b3b"></tw-avatar>
            <tw-avatar name="😀テスト" color="#bc2f2f"></tw-avatar>
            <tw-avatar name="日本" color="#000000" width="64" height="64"></tw-avatar>
          </p>
        </section>

        <section>
          <h2>画像（枠としての背景）</h2>
          <p class="ks-focus-row">
            <tw-avatar
              image-path="https://picsum.photos/seed/wheels/128"
              alt="Demo user"
              name="山"
              color="#3b3b3b"
              width="64"
              height="64"
            ></tw-avatar>
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
