<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVGLoader — The Wheels kitchen-sink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module">
      import "@b4moss/the-wheels-components";
      import checkUrl from "@b4moss/the-wheels-components/assets/check.svg?url";
      import chevronUrl from "@b4moss/the-wheels-components/assets/chevron.svg?url";
      import menuUrl from "@b4moss/the-wheels-components/assets/menu.svg?url";

      document.getElementById("icon-check")?.setAttribute("src", checkUrl);
      document.getElementById("icon-chevron")?.setAttribute("src", chevronUrl);
      document.getElementById("icon-chevron-rot")?.setAttribute("src", chevronUrl);
      document.getElementById("icon-menu")?.setAttribute("src", menuUrl);
    </script>
  </head>
  <body>
    <div class="ks-shell">
      <nav class="ks-nav" aria-label="kitchen-sink">
        <a href="/">Home</a>
        <a href="/typography/">Typography</a>
        <a href="/tokens/">Tokens</a>
        <a href="/svg-loader/" aria-current="page">SVGLoader</a>
        <a href="/spinner/">Spinner</a>
        <a href="/button/">Button</a>
        <a href="/dropdown/">Dropdown</a>
        <a href="/action-menu/">ActionMenu</a>
        <a href="/accordion/">Accordion</a>
        <a href="/modal/">Modal</a>
        <a href="/avatar/">Avatar</a>
        <a href="/vertical-nav/">Vertical Nav</a>
      </nav>

      <main>
        <h1>SVGLoader</h1>
        <p class="ks-meta">fetch → Light DOM 注入 / 失敗時プレースホルダ / 見た目属性</p>

        <section>
          <h2>基本</h2>
          <p class="ks-row">
            <tw-svg-loader
              id="icon-check"
              width="32"
              height="32"
              stroke-color="var(--tw-text-main)"
            ></tw-svg-loader>
          </p>
        </section>

        <section>
          <h2>flip / rotate</h2>
          <p class="ks-row">
            <tw-svg-loader
              id="icon-chevron"
              width="32"
              height="32"
              stroke-color="var(--tw-text-main)"
            ></tw-svg-loader>
            <tw-svg-loader
              id="icon-chevron-rot"
              width="32"
              height="32"
              rotate="180"
              stroke-color="var(--tw-text-main)"
            ></tw-svg-loader>
            <tw-svg-loader
              id="icon-menu"
              width="32"
              height="32"
              flip="horizontal"
              stroke-color="var(--tw-text-main)"
            ></tw-svg-loader>
          </p>
        </section>

        <section>
          <h2>失敗時</h2>
          <p class="ks-row">
            <tw-svg-loader
              src="/this-file-does-not-exist.svg"
              width="32"
              height="32"
            ></tw-svg-loader>
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
