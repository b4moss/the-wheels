name: GitHub Pages preview

# Developer preview on custom domain (issue #63):
#   https://thewheels.oss.b4m.jp/           → kitchen-sink
#   https://thewheels.oss.b4m.jp/storybook/ → Storybook
# Base path is `/` (not project Pages /the-wheels/). No Basic auth. No Netlify.

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          # Try to enable Actions-based Pages when missing (needs pages:write).
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve base paths
        id: base
        run: |
          set -euo pipefail
          # Custom domain thewheels.oss.b4m.jp → site root is `/`
          site_base="/"
          echo "site_base=${site_base}" >> "$GITHUB_OUTPUT"
          echo "storybook_base=/storybook/" >> "$GITHUB_OUTPUT"
          echo "PAGES_BASE=${site_base}"
          echo "PAGES_BASE_STORYBOOK=/storybook/"

      - name: Build Pages site
        env:
          PAGES_BASE: ${{ steps.base.outputs.site_base }}
          PAGES_BASE_STORYBOOK: ${{ steps.base.outputs.storybook_base }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dev/pages-site

  deploy:
    name: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
