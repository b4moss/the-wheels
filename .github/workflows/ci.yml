name: CI

on:
  pull_request:
    branches:
      - develop
      - "dev-v*"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build style
        run: npm run build:style

      - name: Test components with coverage
        run: npm run test:components

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: dev/packages/components/coverage/lcov.info
          flags: components
          fail_ci_if_error: false
          verbose: true

      - name: Test package
        run: npm run test:package

      - name: Build kitchen-sink
        run: npm run build:kitchen-sink

      - name: Build Storybook
        run: npm run build:storybook
