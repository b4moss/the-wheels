name: CI

on:
  pull_request:
    branches:
      - develop
      - "dev-v*"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build style
        run: npm run build:style

      - name: Test components
        run: npm run test:components

      - name: Test package
        run: npm run test:package

      - name: Build kitchen-sink
        run: npm run build:kitchen-sink

      - name: Build Storybook
        run: npm run build:storybook

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect non-docs changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            e2e:
              - "**"
              - "!docs/**"
              - "!**/*.md"

      - name: Skip Playwright (docs/md only)
        if: steps.filter.outputs.e2e != 'true'
        run: echo "Skipping e2e; changed paths are all docs/** or *.md"

      - name: Setup Node.js
        if: steps.filter.outputs.e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.e2e == 'true'
        run: npm ci

      - name: Build style
        if: steps.filter.outputs.e2e == 'true'
        run: npm run build:style

      - name: Build components
        if: steps.filter.outputs.e2e == 'true'
        run: npm run build:components

      - name: Build the-wheels
        if: steps.filter.outputs.e2e == 'true'
        run: npm run build:the-wheels

      - name: Build kitchen-sink
        if: steps.filter.outputs.e2e == 'true'
        run: npm run build:kitchen-sink

      - name: Install Playwright Chromium
        if: steps.filter.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        if: steps.filter.outputs.e2e == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.filter.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dev/playwright-report/
          retention-days: 7
